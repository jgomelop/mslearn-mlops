name: Linting and Unit Testing checks

on:
  pull_request:
    branches:
      - main

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Flake8
      run: python -m pip install flake8
    
    - name: Run linting tests
      run: flake8 src/xray_model/

  unit_testing:
    name: Unit testing
    runs-on: ubuntu-latest
    steps: 
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # requirementes already has pytest
    - name: Install pytest
      run: |
        pip install -r requirements-dev.txt

    - name: Run unit tests
      run: pytest .