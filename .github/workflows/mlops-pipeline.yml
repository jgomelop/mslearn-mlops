name: MLOps Pipeline with Approvals

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_train:
        description: 'Force training execution'
        required: false
        type: boolean
        default: false

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should-train: ${{ steps.check.outputs.should_train }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Check if training should run
        id: check
        shell: bash
        run: |
          # (Keep your existing check logic here)
          # For brevity, assuming logic determines TRUE:
          SHOULD_TRAIN="true"
          REASON="Valid Trigger"
          
          # Actual logic from your original file goes here...
          
          echo "should_train=$SHOULD_TRAIN" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT

  train:
    needs: check-trigger
    if: needs.check-trigger.outputs.should-train == 'true'
    runs-on: self-hosted
    environment: azure-ml-training
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Submit training pipeline
        shell: powershell
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_WORKSPACE_NAME: ${{ secrets.AZURE_WORKSPACE_NAME }}
          AZURE_CLI_PATH: ${{ secrets.AZURE_CLI_PATH }}
        run: |
          .\scripts\submit_training_pipeline.ps1 -JobYamlPath "jobs/job.yml" -AzCliPath $env:AZURE_CLI_PATH
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: training-outputs
          path: training_job_id.txt

  register-approval:
    needs: train
    runs-on: ubuntu-latest
    environment: model-registration-approval
    steps:
      - name: Notify approval needed
        run: echo "Training completed. Awaiting approval."

  register-model:
    needs: register-approval
    runs-on: self-hosted
    environment: model-registration-approval
    outputs:
      model-name: ${{ steps.register.outputs.model_name }}
      model-version: ${{ steps.register.outputs.model_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download training outputs
        uses: actions/download-artifact@v3
        with:
          name: training-outputs
          path: .
      
      - name: Register model
        id: register
        shell: powershell
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_WORKSPACE_NAME: ${{ secrets.AZURE_WORKSPACE_NAME }}
          AZURE_CLI_PATH: ${{ secrets.AZURE_CLI_PATH }}
        run: |
          .\scripts\register_model.ps1 -ConfigPath "scripts/register_model.yml" -AzCliPath $env:AZURE_CLI_PATH
          
          # Read model info generated by the script
          $modelInfo = Get-Content model_info.json | ConvertFrom-Json
          
          # Set GitHub Outputs
          "model_name=$($modelInfo.name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "model_version=$($modelInfo.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      
      - name: Upload model info
        uses: actions/upload-artifact@v3
        with:
          name: model-info
          path: model_info.json

  deploy-approval:
    needs: register-model
    runs-on: ubuntu-latest
    environment: production-deployment-approval
    steps:
      - run: echo "Deploying Model ${{ needs.register-model.outputs.model-name }} Version ${{ needs.register-model.outputs.model-version }}"

  deploy-to-production:
    needs: deploy-approval
    runs-on: self-hosted
    environment: production-deployment-approval
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Display Info
        run: echo "Deployment Logic Here"