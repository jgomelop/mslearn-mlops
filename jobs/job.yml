$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json

# Job configuration
display_name: densenet121-res224-all-4epochs-2batch-0_01-lr
experiment_name: xray-train-xray_data_source-1

# Code and environment
# FIX: Path must be relative to this yaml file (up one level, then into src)
code: ../src/xray_model
environment: azureml:xray-training-cpu:4

# Compute target
compute: azureml:training-cpu-2

# Command to execute
# Note: 'train.py' is at the root of the uploaded 'code' folder
command: >-
  python train.py
  --training_data ${{inputs.training_data}}
  --model_name ${{inputs.model_name}}
  --batch_size ${{inputs.batch_size}}
  --num_epochs ${{inputs.num_epochs}}
  --learning_rate ${{inputs.learning_rate}}

# Input parameters
inputs:
  training_data:
    type: uri_folder
    path: azureml:xray_data_source:1
  model_name: densenet121-res224-all
  batch_size: 2
  num_epochs: 4
  learning_rate: 0.01