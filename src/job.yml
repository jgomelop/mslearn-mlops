$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
code: xray_model
command: >-
  python train.py
  --training_data ${{inputs.training_data}}
inputs:
  training_data: 
    type: uri_folder 
    path: azureml:xray_data_source:1
environment: azureml:xray-training-cpu:2.4
compute: azureml:cpu-cluster
experiment_name: xray-model-training-test
description: Training job for X-ray model
display_name: xray-model-training-test