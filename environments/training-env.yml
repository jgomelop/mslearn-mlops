name: xray-training-cpu
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy
  - pandas
  - scikit-learn
  - pillow
  - scikit-image
  - imageio
  - tqdm
  - requests
  - pip:
      # Añade el índice CPU de PyTorch sin sustituir PyPI
      - --extra-index-url https://download.pytorch.org/whl/cpu
      # Tríada compatible
      - torch==2.2.2
      - torchvision==0.17.2
      - torchaudio==2.2.2
      # Forzar wheel de pyarrow 
      - pyarrow>=14
      - mlflow<2.8
      - azureml-mlflow
      - pydicom
      - torchxrayvision>=1.3.4
